name: ตรวจก่อน merge

# เว็บนี้ไม่ deploy ผ่าน Actions แล้ว — GitHub Pages ตั้งเป็น "Deploy from a branch"
# (main / root) ซึ่ง GitHub จัดการให้เองและไม่กินโควตา Actions ของบัญชี
# workflow นี้จึงเหลือหน้าที่เดียวคือ "ตรวจ" ว่าคลังข้อสอบกับหน้าเว็บยังตรงกัน
# ถ้า Actions ของบัญชีใช้ไม่ได้ ยังตรวจเองในเครื่องได้ด้วยคำสั่งชุดเดียวกัน (ดู README)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ตรวจคลังข้อสอบและหน้าเว็บ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ตรวจว่าคลังรูปตรงกับ tools/build_figures.py
        run: |
          python3 tools/build_figures.py
          git diff --exit-code -- questions/figures.json \
            || { echo "::error::questions/figures.json ไม่ตรงกับ tools/build_figures.py — รันสคริปต์แล้ว commit ใหม่"; exit 1; }

      - name: ตรวจว่า index.html ประกอบจากคลังข้อสอบแล้วตรงกัน
        run: python3 tools/build.py --check

      - name: ตรวจคลังข้อสอบ (schema, เฉลย, SVG, syntax, สำเนา)
        run: python3 tools/validate.py

      - name: ทดสอบพฤติกรรมหน้าเว็บ
        run: |
          npm install jsdom --no-save --silent
          node tools/dom_test.cjs
